apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetdm.fullname" . }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fleet.replicaCount }}
  selector:
    matchLabels:
      {{- include "fleetdm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleetdm.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.fleet.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z -w2 {{ include "fleetdm.mysql.host" . }} {{ .Values.fleet.database.mysql.port }};
              do echo waiting for mysql; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z -w2 {{ include "fleetdm.redis.host" . }} {{ .Values.fleet.database.redis.port }};
              do echo waiting for redis; sleep 2; done
      containers:
        - name: fleet
          image: "{{ .Values.fleet.image.repository }}:{{ .Values.fleet.image.tag }}"
          imagePullPolicy: {{ .Values.fleet.image.pullPolicy }}
          command: ["fleet", "serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "fleetdm.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.fleet.resources | nindent 12 }}
