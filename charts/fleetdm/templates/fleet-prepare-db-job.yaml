{{- if .Values.prepareDb.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fleetdm.fullname" . }}-prepare-db
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    # post-install only (no post-upgrade) so this runs once, on the initial install.
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.prepareDb.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "fleetdm.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z -w2 {{ include "fleetdm.mysql.host" . }} {{ .Values.fleet.database.mysql.port }};
              do echo waiting for mysql; sleep 2; done
      containers:
        - name: prepare-db
          image: "{{ .Values.fleet.image.repository }}:{{ .Values.fleet.image.tag }}"
          imagePullPolicy: {{ .Values.fleet.image.pullPolicy }}
          command: ["fleet", "prepare", "db", "--no-prompt"]
          env:
            {{- include "fleetdm.env" . | nindent 12 }}
{{- end }}
