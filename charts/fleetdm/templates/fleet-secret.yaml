apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.serverPrivateKeySecretName" . }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
  annotations:
    # Keep the key stable across upgrades instead of rotating it on every deploy.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  private-key: {{ (lookup "v1" "Secret" .Release.Namespace (include "fleetdm.serverPrivateKeySecretName" .)).data | default dict | dig "private-key" (randAlphaNum 32 | b64enc) }}
